name: historyguessr

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: historyguessr-php:dev
  volumes:
    - ./:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --timeout=120
    restart: unless-stopped
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/app
      # Linux binaries for esbuild/rollup must not clash with the host's node_modules.
      - node-modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: historyguessr
      POSTGRES_USER: historyguessr
      POSTGRES_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historyguessr -d historyguessr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible storage (MinIO no longer publishes Docker images).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: s3-local
      RUSTFS_SECRET_KEY: s3-local-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${FORWARD_S3_PORT:-9000}:9000"
      - "${FORWARD_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data

  # Creates the bucket; only processed images (questions/*, quizzes/*) are publicly readable.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: s3-local
      AWS_SECRET_ACCESS_KEY: s3-local-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/s3-public-policy.json:/policy.json:ro
    entrypoint: >
      sh -c "for i in $$(seq 1 30); do aws --endpoint-url http://s3:9000 s3api list-buckets >/dev/null 2>&1 && break; sleep 1; done;
             aws --endpoint-url http://s3:9000 s3api head-bucket --bucket historyguessr 2>/dev/null ||
             aws --endpoint-url http://s3:9000 s3api create-bucket --bucket historyguessr;
             aws --endpoint-url http://s3:9000 s3api put-bucket-policy --bucket historyguessr --policy file:///policy.json"

  # Self-hosted vector map: OSM tiles + glyphs/sprites, reached only through nginx at /maps/.
  # Data lives outside Git and the image (docker/maps/README.md); `make maps` fetches it.
  maps:
    image: versatiles/versatiles:v5.1.0-alpine@sha256:6f62bfd13af6ffae3c5492db975c4f8128d06e95a26ba08ef308879954b22bc2
    command:
      - serve
      - --disable-api
      - --static
      - "[/assets]/assets"
      - "[osm]/data/current.versatiles"
    volumes:
      - ./docker/maps/data:/data:ro
      - ./docker/maps/assets:/assets:ro
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/tiles/osm/tiles.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"

volumes:
  node-modules:
  postgres-data:
  s3-data:
