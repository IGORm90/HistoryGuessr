# Self-hosted map (service `maps`, docker/maps/README.md): proxied and cached under /maps/.
proxy_cache_path /var/cache/nginx/maps levels=1:2 keys_zone=maps:10m max_size=2g inactive=7d use_temp_path=off;

# One cache entry per encoding the tile server can answer with.
map $http_accept_encoding $maps_encoding {
    default "";
    "~*br"  br;
    "~*gzip" gzip;
}

log_format maps 'maps $remote_addr [$time_local] "$request" $status $body_bytes_sent '
                'cache=$upstream_cache_status upstream=$upstream_response_time';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Map tiles, glyphs and sprites. Everything else of the tile server (status, API) stays internal.
    location /maps/ {
        return 404;
    }

    # TileJSON: the tile server knows its tiles as /tiles/osm/..., the browser reaches them under /maps/.
    # Not cached for long: its maxzoom changes when another dataset is switched in.
    location = /maps/tiles/osm/tiles.json {
        limit_except GET { deny all; }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $maps_upstream http://maps:8080;
        proxy_pass $maps_upstream/tiles/osm/tiles.json;
        proxy_http_version 1.1;
        proxy_set_header Host maps;
        proxy_set_header Accept-Encoding "";

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"/tiles/' '"/maps/tiles/';

        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=300";

        access_log /dev/stdout maps;
    }

    location ~ ^/maps/(?<maps_path>tiles/osm/.+|assets/(?:glyphs|sprites)/.+)$ {
        limit_except GET { deny all; }

        # Resolve at request time, so nginx starts even before the map service has data.
        resolver 127.0.0.11 valid=30s ipv6=off;
        # Named capture: evaluating the regex map of $maps_encoding would overwrite $1.
        set $maps_upstream http://maps:8080;
        proxy_pass $maps_upstream/$maps_path;
        proxy_http_version 1.1;
        proxy_set_header Host maps;
        proxy_set_header Accept-Encoding $maps_encoding;

        proxy_cache maps;
        proxy_cache_key "$maps_path|$maps_encoding";
        proxy_cache_lock on;
        proxy_cache_valid 200 204 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires;

        # Tile URLs survive a dataset switch (switch.sh clears this cache), so browsers revalidate daily.
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Cache-Status $upstream_cache_status;

        access_log /dev/stdout maps;
    }

    # Vite emits MapLibre's module worker as .mjs, which nginx's mime.types does not know;
    # a module worker served as application/octet-stream does not start.
    location ~ ^/build/.+\.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
